<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Frame Studio · URL a URL</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f5f7;--panel:#fff;--line:#e3e5ea;--tx:#14161a;--mu:#6b7280;--ac:#5b5bf0;--acx:#fff;--c1:#eceef2;--c2:#fff;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1013;--panel:#171a1f;--line:#262a31;--tx:#eef0f3;--mu:#8b93a1;--ac:#7c7cff;--acx:#0e1013;--c1:#1d2026;--c2:#14161a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--ac),#e879f9);display:grid;place-items:center;color:#fff;font-weight:700}
header span{margin-left:auto;color:var(--mu);font-size:12px}
main{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 58px)}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px}
section{margin-bottom:20px}h3{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
input[type=text],input[type=number],select{width:100%;padding:9px 11px;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:9px;font:inherit}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--tx);padding:9px 12px;border-radius:9px}
button:hover{border-color:var(--ac)}button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.chip{padding:8px 4px;font-size:12px;text-align:center;line-height:1.2}.chip small{display:block;color:var(--mu);font-size:10px}
.chip.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
label.s{display:block;color:var(--mu);font-size:12px;margin:8px 0 3px}
.stage{padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.cv{background:repeating-conic-gradient(var(--c1) 0% 25%,var(--c2) 0% 50%) 0 0/18px 18px;border:1px solid var(--line);border-radius:10px;line-height:0;max-width:100%;display:none}
.cv img{max-width:100%;max-height:60vh;display:block;border-radius:9px}
.empty{color:var(--mu);text-align:center;max-width:340px;margin-top:12vh}
.res{width:100%;max-width:720px}.info{color:var(--mu);font-size:12px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none}#toast.show{opacity:1}
@media(max-width:820px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header><div class="logo">F</div><b>Frame Studio</b><span>URL → URL · PNG con transparencia</span></header>
<main>
<aside>
<section><h3>1 · URL de la imagen</h3>
<div class="row"><input type="text" id="src" placeholder="Pega aquí la URL de tu logo" autofocus><button class="p" id="load">Cargar</button><button id="clr" title="Limpiar">✕</button></div></section>
<section><h3>2 · Formato</h3><div class="chips" id="fmt"></div>
<label class="s">Ancho de salida (px)</label>
<div class="row"><input type="number" id="w" value="1000" min="16" max="8000"></div>
<label class="s">Ajuste</label>
<select id="fit"><option value="contain">Entero (con bandas)</option><option value="cover">Rellenar (recorta)</option><option value="fill">Estirar</option></select>
<label class="s" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="we" checked> No ampliar (evita perder nitidez)</label>
</section>
<section><h3>3 · Fondo y forma</h3>
<div class="row"><button id="tr" class="chip on" style="flex:1">Fondo transparente</button><input type="color" id="bg" value="#ffffff" style="width:44px;height:36px;border:1px solid var(--line);border-radius:8px;background:none"></div>
<label class="s">Máscara</label>
<select id="mask"><option value="">Ninguna</option><option value="circle">Círculo</option><option value="ellipse">Elipse</option><option value="hexagon">Hexágono</option><option value="star">Estrella</option><option value="heart">Corazón</option></select>
<label class="s">Formato de archivo</label>
<select id="out"><option value="png">PNG (sin pérdida, transparencia)</option><option value="webp">WebP sin pérdida (transparencia)</option></select>
</section>
</aside>
<div class="stage">
<div class="empty" id="empty"><b>Pega la URL de una imagen</b><br>Recibirás al instante una nueva URL ya editada, lista para copiar.</div>
<div class="res" id="res" style="display:none">
<div class="row"><input type="text" id="o" readonly><button class="p" id="cp">Copiar</button><button id="op">Abrir</button></div>
<div class="info" id="info"></div></div>
<div class="cv" id="cv"><img id="pv" alt="Vista previa" referrerpolicy="no-referrer"></div>
</div>
</main>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const F=[['Original',0,'sin cambiar'],['Apaisado',16/9,'16:9'],['Póster',2/3,'2:3'],['Cuadrado',1,'1:1'],['Retrato',4/5,'4:5'],['Panorama',3,'3:1']];
let ratio=0,tr=true,tm;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
F.forEach((f,i)=>{const b=document.createElement('button');b.className='chip'+(i?'':' on');b.innerHTML=f[0]+'<small>'+f[2]+'</small>';
b.onclick=()=>{ratio=f[1];[...$('fmt').children].forEach(x=>x.classList.remove('on'));b.classList.add('on');go()};$('fmt').appendChild(b)});
function build(){let u=$('src').value.trim();if(!u)return '';
const P=['url='+encodeURIComponent(u)];
if(ratio){const w=Math.max(16,Math.min(8000,+$('w').value||1000));P.push('w='+w,'h='+Math.round(w/ratio),'fit='+$('fit').value);
if($('fit').value==='contain'&&$('we').checked)P.push('we');
P.push('cbg='+(tr?'0000':$('bg').value.slice(1)))}
else if(!tr)P.push('bg='+$('bg').value.slice(1));
if($('mask').value)P.push('mask='+$('mask').value,'mbg='+(tr?'0000':$('bg').value.slice(1)));
if($('out').value==='webp')P.push('output=webp','ll');else P.push('output=png');
return 'https://wsrv.nl/?'+P.join('&')}
function go(){clearTimeout(tm);tm=setTimeout(()=>{const u=build();
$('empty').style.display=u?'none':'';$('res').style.display=u?'block':'none';$('cv').style.display=u?'inline-block':'none';
if(!u)return;$('o').value=u;$('info').textContent='Generando vista previa…';$('pv').src=u},250)}
$('pv').onload=()=>{$('info').textContent=$('pv').naturalWidth+' × '+$('pv').naturalHeight+' px · '+($('out').value==='png'?'PNG':'WebP')+' · sin pérdida'+(tr?' · transparencia conservada':'')};
$('pv').onerror=()=>{$('info').textContent='Comprobando…';const t=new Image();
t.onload=()=>{$('info').textContent='wsrv.nl no pudo procesar esa imagen. Comprueba que la URL es pública y apunta directamente a un archivo de imagen (.png, .jpg, .svg…).'};
t.onerror=()=>{$('info').textContent='Este visor bloquea las imágenes externas, por eso no hay vista previa. La URL de arriba es válida: cópiala o ábrela en el navegador (Chrome, Safari…).'};
t.src='https://wsrv.nl/?url=wsrv.nl/lichtenstein.jpg&w=16&output=png'};
['src','w','fit','we','mask','out'].forEach(i=>{$(i).addEventListener('input',go);$(i).addEventListener('change',go)});
$('src').addEventListener('paste',()=>setTimeout(go,30));
$('bg').oninput=()=>{tr=false;$('tr').classList.remove('on');go()};
$('tr').onclick=()=>{tr=!tr;$('tr').classList.toggle('on',tr);go()};
$('load').onclick=()=>{if(!$('src').value.trim())return toast('Pega primero una URL');go()};
$('src').addEventListener('keydown',e=>{if(e.key==='Enter')$('load').click()});
$('clr').onclick=()=>{$('src').value='';go()};
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText($('o').value);toast('URL copiada')}catch(e){$('o').select();toast('Selecciona y copia')}};
$('op').onclick=()=>window.open($('o').value,'_blank','noopener');
$('o').onfocus=e=>e.target.select();
</script>
</body>
</html>
